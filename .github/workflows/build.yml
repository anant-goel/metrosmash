name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Step 1: Install vcpkg (latest HEAD, full clone) ───────────────────
      # We use the FULL clone so git show works on any commit.
      # We do NOT pin a specific commit in the workflow — instead we read
      # whatever HEAD is and inject it as builtin-baseline dynamically.
      - name: Clone and bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      # ── Step 2: Patch vcpkg.json with the real current HEAD baseline ──────
      # This is the KEY fix: builtin-baseline must equal the exact commit
      # that vcpkg.exe sees in its own .git dir. We read it live.
      - name: Set vcpkg baseline to current HEAD
        shell: pwsh
        run: |
          $sha = git -C C:\vcpkg rev-parse HEAD
          Write-Host "vcpkg HEAD: $sha"

          $vcpkgJson = Get-Content vcpkg.json | ConvertFrom-Json
          $vcpkgJson."builtin-baseline" = $sha
          $vcpkgJson | ConvertTo-Json -Depth 10 | Set-Content vcpkg.json

          Write-Host "Updated vcpkg.json:"
          Get-Content vcpkg.json

      # ── Step 3: Install SFML 2.6.1 (overrides block forces it) ───────────
      - name: Install dependencies via vcpkg
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install `
            --triplet x64-windows `
            --x-manifest-root .

      # ── Step 4: Configure CMake ───────────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -A x64

      # ── Step 5: Build ─────────────────────────────────────────────────────
      - name: Build Release
        run: cmake --build build --config Release --parallel

      # ── Step 6: Collect EXE + DLLs + assets ──────────────────────────────
      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          # The EXE
          Copy-Item "build\Release\MetroSmash.exe" "release\" -Force

          # Runtime DLLs (SFML, OpenAL, FLAC, OGG, Vorbis, freetype, etc.)
          if (Test-Path "C:\vcpkg\installed\x64-windows\bin") {
            Get-ChildItem "C:\vcpkg\installed\x64-windows\bin\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "release\" -Force
            }
          }

          # Assets folder (fonts + audio)
          if (Test-Path "assets") {
            Copy-Item -Recurse -Force "assets" "release\assets"
          }

          Write-Host "=== Release folder ==="
          Get-ChildItem "release" | Select-Object Name, @{N='KB';E={[int]($_.Length/1KB)}} | Format-Table

	- name: Copy SFML DLLs
  	shell: cmd
  	run: |
    	echo Creating output folder...
    	if not exist build\Release mkdir build\Release

    	echo Copying SFML DLLs from vcpkg (global)...
    	if exist C:\vcpkg\installed\x64-windows\bin (
      	for %%f in (C:\vcpkg\installed\x64-windows\bin\*.dll) do copy "%%f" build\Release\
    	)

    	echo Copying SFML DLLs from vcpkg (manifest mode)...
    	if exist build\vcpkg_installed\x64-windows\bin (
      	for %%f in (build\vcpkg_installed\x64-windows\bin\*.dll) do copy "%%f" build\Release\
    	)

    	echo Done copying DLLs.

      # ── Step 7: Zip ───────────────────────────────────────────────────────
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path "release\*" -DestinationPath "MetroSmash.zip" -Force

      # ── Step 8: Upload artifacts ──────────────────────────────────────────
      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Windows-Folder
          path: release/
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Windows-ZIP
          path: MetroSmash.zip
          retention-days: 30

      # ── Step 9: GitHub Release on push to main ────────────────────────────
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MetroSmash Build #${{ github.run_number }}"
          files: MetroSmash.zip
          body: |
            ## Metro Smash — Build #${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### How to run
            1. Download and extract `MetroSmash.zip`
            2. Keep **all DLLs** next to `MetroSmash.exe`
            3. Run `MetroSmash.exe`

            ### Requirements
            - Windows 10 / 11 (64-bit)
            - GPU with OpenGL 2.1+ support
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
