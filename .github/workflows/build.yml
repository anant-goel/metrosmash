name: Build MetroSmash (Windows)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup vcpkg
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 7eab8ee6b8bdb94466c46744a9515f6826185cac

      # 3. Install SFML 2.6
      - name: Install dependencies
        run: |
          C:\vcpkg\vcpkg.exe install sfml:x64-windows

      # 4. Configure CMake
      - name: Configure CMake
        run: |
          cmake -B build -S . ^
          -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
          -A x64

      # 5. Build
      - name: Build
        run: |
          cmake --build build --config Release --parallel

      # 6. Collect EXE + DLLs + assets
      - name: Collect EXE and DLLs
        shell: cmd
        run: |
          if exist release rmdir /S /Q release
          mkdir release

          echo Copy EXE...
          copy build\Release\MetroSmash.exe release\

          echo Copy DLLs from global vcpkg...
          if exist C:\vcpkg\installed\x64-windows\bin (
            for %%f in (C:\vcpkg\installed\x64-windows\bin\*.dll) do copy "%%f" release\
          )

          echo Copy DLLs from manifest vcpkg...
          if exist build\vcpkg_installed\x64-windows\bin (
            for %%f in (build\vcpkg_installed\x64-windows\bin\*.dll) do copy "%%f" release\
          )

          echo Copy assets if present...
          if exist assets (
            xcopy /E /I /Y assets release\assets
          )

      # 7. Create ZIP
      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive -Path release\* -DestinationPath MetroSmash.zip -Force

      # 8. Upload ZIP artifact
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Build
          path: MetroSmash.zip
