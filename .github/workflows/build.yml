name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      # Pin vcpkg to 2024.09.30 release — has SFML 2.6.1, has versions/baseline.json
      VCPKG_COMMIT: a34c873a9197a40b2f29f2f8dfd6be4965bd01b8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── vcpkg: clone + checkout pinned commit ─────────────────────────────
      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          cd C:\vcpkg
          git fetch --depth=1 origin $env:VCPKG_COMMIT
          git checkout $env:VCPKG_COMMIT
          .\bootstrap-vcpkg.bat -disableMetrics
          Write-Host "vcpkg version: $(C:\vcpkg\vcpkg.exe version)"

      # ── Install SFML 2.6.1 (overridden in vcpkg.json) ────────────────────
      - name: Install dependencies
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install `
            --triplet x64-windows `
            --x-manifest-root . `
            --x-install-root C:\vcpkg\installed `
            --x-feature=versions

      # ── CMake configure ───────────────────────────────────────────────────
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -A x64

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build Release
        run: cmake --build build --config Release --parallel

      # ── Collect EXE + DLLs + assets ──────────────────────────────────────
      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          # EXE
          Copy-Item "build\Release\MetroSmash.exe" "release\" -Force

          # All runtime DLLs from vcpkg (SFML + OpenAL + FLAC + OGG + Vorbis)
          if (Test-Path "C:\vcpkg\installed\x64-windows\bin") {
            Get-ChildItem "C:\vcpkg\installed\x64-windows\bin\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "release\" -Force
            }
          }

          # Assets (fonts, audio clips)
          if (Test-Path "assets") {
            Copy-Item -Recurse -Force "assets" "release\assets"
          }

          Write-Host "=== Release contents ==="
          Get-ChildItem "release\" | Select-Object Name,Length | Format-Table -AutoSize

      # ── Zip ───────────────────────────────────────────────────────────────
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path "release\*" -DestinationPath "MetroSmash.zip" -Force

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Windows-Folder
          path: release/
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Windows-ZIP
          path: MetroSmash.zip
          retention-days: 30

      # ── GitHub Release (push to main only) ───────────────────────────────
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MetroSmash Build #${{ github.run_number }}"
          files: MetroSmash.zip
          body: |
            ## Metro Smash — Build #${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### How to run
            1. Download and extract `MetroSmash.zip`
            2. Keep **all DLLs** next to `MetroSmash.exe`
            3. Run `MetroSmash.exe`

            ### Requirements
            - Windows 10 / 11 (64-bit)
            - GPU with OpenGL 2.1+ support
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
