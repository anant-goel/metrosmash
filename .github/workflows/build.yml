name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install vcpkg pinned before SFML 3
        shell: cmd
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          cd /d C:\vcpkg
          git checkout 2024.07.12
          bootstrap-vcpkg.bat

      - name: Install SFML 2.6 via vcpkg
        shell: cmd
        run: C:\vcpkg\vcpkg.exe install sfml:x64-windows
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect EXE, DLLs and assets
        shell: cmd
        run: |
          if not exist release mkdir release
          copy build\Release\MetroSmash.exe release\

          echo Copying all vcpkg runtime DLLs...
          for %%f in (C:\vcpkg\installed\x64-windows\bin\*.dll) do copy "%%f" release\

          if exist assets (
            xcopy /E /I /Y assets release\assets
          ) else (
            echo Assets folder not found, skipping assets copy.
          )

      - name: Create ZIP package
        shell: powershell
        run: |
          if (Test-Path MetroSmash-Windows-x64.zip) { Remove-Item MetroSmash-Windows-x64.zip -Force }
          Compress-Archive -Path release\* -DestinationPath MetroSmash-Windows-x64.zip

      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Windows-Folder
          path: release/
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Windows-ZIP
          path: MetroSmash-Windows-x64.zip
          retention-days: 30

      - name: Create GitHub Release on push to main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MetroSmash Build #${{ github.run_number }}"
          files: |
            release/*
            MetroSmash-Windows-x64.zip
          body: |
            Automated Windows build for MetroSmash.

            Commit: ${{ github.sha }}

            Recommended download: MetroSmash-Windows-x64.zip
            Extract all files and run MetroSmash.exe.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
