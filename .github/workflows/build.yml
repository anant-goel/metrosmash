name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat

      - name: Install SFML 3 via vcpkg
        run: C:/vcpkg/vcpkg.exe install sfml:x64-windows
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect EXE and DLLs
        shell: cmd
        run: |
          if not exist release mkdir release

          copy build\Release\MetroSmash.exe release\

          echo Copying DLL dependencies...
          for %%f in (C:\vcpkg\installed\x64-windows\bin\*.dll) do (
            copy "%%f" release\
          )

          if exist assets (
            echo Copying assets...
            xcopy /E /I /Y assets release\assets
          ) else (
            echo Assets folder not found, skipping.
          )

      # 🔥 NEW: Create ZIP
      - name: Create ZIP package
        shell: powershell
        run: |
          Compress-Archive -Path release\* -DestinationPath MetroSmash.zip

      # 📦 Upload folder
      - name: Upload folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Windows-Folder
          path: release/
          retention-days: 30

      # 📦 Upload ZIP
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Windows-ZIP
          path: MetroSmash.zip
          retention-days: 30

      # 🚀 Release with ZIP
      - name: Create Release on push to main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MetroSmash Build #${{ github.run_number }}"
          files: |
            release/*
            MetroSmash.zip
          body: |
            Automated build for MetroSmash

            Commit: ${{ github.sha }}

            Download options:
            - ZIP (recommended)
            - Raw folder

            Instructions:
            - Extract ZIP
            - Run MetroSmash.exe

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
