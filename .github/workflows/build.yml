name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          C:/vcpkg/bootstrap-vcpkg.bat

      - name: Install SFML via vcpkg
        run: |
          C:/vcpkg/vcpkg.exe install sfml:x64-windows
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect EXE and DLLs
        run: |
          mkdir release
          copy build\Release\MetroSmash.exe release\
          # Copy SFML DLLs needed at runtime
          copy C:\vcpkg\installed\x64-windows\bin\sfml-graphics-2.dll   release\ 2>nul || true
          copy C:\vcpkg\installed\x64-windows\bin\sfml-window-2.dll     release\ 2>nul || true
          copy C:\vcpkg\installed\x64-windows\bin\sfml-system-2.dll     release\ 2>nul || true
          copy C:\vcpkg\installed\x64-windows\bin\sfml-audio-2.dll      release\ 2>nul || true
          copy C:\vcpkg\installed\x64-windows\bin\openal32.dll          release\ 2>nul || true
          # Copy Visual C++ runtime DLLs
          copy C:\vcpkg\installed\x64-windows\bin\msvcp140.dll          release\ 2>nul || true
          copy C:\vcpkg\installed\x64-windows\bin\vcruntime140.dll      release\ 2>nul || true
          # Copy assets if they exist
          if exist assets xcopy /E /I assets release\assets
        shell: cmd

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetroSmash-Windows-x64
          path: release/
          retention-days: 30

      - name: Create Release (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "MetroSmash Build #${{ github.run_number }}"
          files: release/*
          body: |
            Automated build from commit ${{ github.sha }}
            
            **How to run:**
            1. Download and extract all files
            2. Run MetroSmash.exe
            (Keep all DLLs in the same folder as the .exe)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
